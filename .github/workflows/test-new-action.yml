name: Test New CloudShip Action
on:
  push:
    branches: [test-security-comments]
  pull_request:

jobs:
  test-action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Test CloudShip AI Security Action
        uses: cloudshipai/station-action@main
        with:
          agent: infrastructure-security
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
