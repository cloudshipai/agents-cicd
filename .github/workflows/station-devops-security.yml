name: Station DevOps Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  devops-security-audit:
    name: Station DevOps Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Load Station Security Environment
        run: |
          echo "🚀 Loading CloudShip Security Environment"
          echo "✅ Using public CloudShip security image"

      - name: Run Security Scanner Agent
        id: security_scan
        run: |
          # Run CloudShip Security Scanner and capture output
          docker run --rm \
            --privileged \
            -v "$(pwd):/workspace" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e OPENAI_API_KEY="${OPENAI_API_KEY}" \
            -e PROJECT_ROOT=/workspace \
            ghcr.io/cloudshipai/station-security:latest bash -c "
            echo '🔍 Starting Security Scanner Agent...' &&
            stn sync default -i=false &&
            stn agent run 'Infrastructure Security Auditor' 'Scan /workspace for security vulnerabilities, focusing on terraform/, docker/, python/, and scripts/ directories. Detect secrets, misconfigurations, and provide remediation steps.' --tail
          " | tee security_scan_output.txt
          
          # Ensure output file exists and has content
          if [[ ! -s security_scan_output.txt ]]; then
            echo "❌ No output captured from Security Scanner" > security_scan_output.txt
          fi
          
          # Extract key findings from the output
          echo "SECURITY_SCAN_RESULTS<<EOF" >> $GITHUB_OUTPUT
          cat security_scan_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run Supply Chain Scanner
        id: supply_chain
        run: |
          # Run CloudShip Supply Chain Guardian
          docker run --rm \
            --privileged \
            -v "$(pwd):/workspace" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e OPENAI_API_KEY="${OPENAI_API_KEY}" \
            -e PROJECT_ROOT=/workspace \
            ghcr.io/cloudshipai/station-security:latest bash -c "
            echo '🔗 Starting Supply Chain Guardian...' &&
            stn sync default -i=false &&
            stn agent run 'Supply Chain Guardian' 'Generate SBOM and scan dependencies in /workspace for vulnerabilities' --tail
          " | tee supply_chain_output.txt
          
          # Ensure output file exists and has content
          if [[ ! -s supply_chain_output.txt ]]; then
            echo "❌ No output captured from Supply Chain Guardian" > supply_chain_output.txt
          fi

          # Extract key findings from the output
          echo "SUPPLY_CHAIN_RESULTS<<EOF" >> $GITHUB_OUTPUT
          cat supply_chain_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Create Security Report Summary
        if: always()
        run: |
          echo "## 🔒 CloudShip AI Security Audit Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Infrastructure Security**: Scanned for vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Supply Chain**: Generated SBOM and checked dependencies" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**View detailed findings:** [CloudShip Dashboard](https://cloudshipai.com/dashboard)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Powered by [CloudShip AI](https://cloudshipai.com)_" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with Security Results
        if: github.event_name == 'pull_request'
        env:
          SECURITY_SUMMARY: ${{ steps.create_summary.outputs.SECURITY_SUMMARY }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: process.env.SECURITY_SUMMARY
            });

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: station-security-reports
          path: |
            security-reports/
            security_scan_output.txt
            terraform_audit_output.txt
            security_summary.md
          retention-days: 30