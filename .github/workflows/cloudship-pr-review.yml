name: CloudShip Security - PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-security-review:
    runs-on: ubuntu-latest
    name: PR Security Review

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Security Review
      run: |
        docker run --rm \
          --privileged \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
          -e CLOUDSHIP_REGISTRATION_KEY="${{ secrets.CLOUDSHIP_REGISTRATION_KEY }}" \
          -e PROJECT_ROOT=/workspace \
          -v ${{ github.workspace }}:/workspace \
          ghcr.io/cloudshipai/station-security:latest \
          bash -c "stn sync default -i=false && stn agent run 'PR Security Reviewer' 'Review PR #${{ github.event.pull_request.number }} for security vulnerabilities, code issues, and compliance violations. Provide actionable remediation guidance.' --tail"

    - name: Comment on PR
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 🔒 CloudShip AI Security Review Complete

            Your pull request has been analyzed for security vulnerabilities.

            📊 **View detailed findings:** [CloudShip Dashboard](https://cloudshipai.com/dashboard)
            🔍 **Workflow run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            _Powered by [CloudShip AI](https://cloudshipai.com)_`
          })
