name: CloudShip Security - Supply Chain

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Monday 8 AM UTC

jobs:
  supply-chain-security:
    runs-on: ubuntu-latest
    name: Supply Chain Security Scan

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Supply Chain Security Scan
      run: |
        docker run --rm \
          --privileged \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
          -e PROJECT_ROOT=/workspace \
          -v ${{ github.workspace }}:/workspace \
          ghcr.io/cloudshipai/station-security:latest \
          bash -c "stn sync default -i=false && stn agent run 'Supply Chain Guardian' 'Generate SBOM and scan dependencies for vulnerabilities in /workspace' --tail"

    - name: Security Summary
      if: always()
      run: |
        echo "## 🔒 CloudShip AI Supply Chain Security Scan Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Scanned:** Dependencies and supply chain" >> $GITHUB_STEP_SUMMARY
        echo "**View detailed findings:** [CloudShip Dashboard](https://cloudshipai.com/dashboard)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "_Powered by [CloudShip AI](https://cloudshipai.com)_" >> $GITHUB_STEP_SUMMARY
